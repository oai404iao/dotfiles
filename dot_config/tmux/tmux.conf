# =============================================
# 1. 基础设置 (融合 agent-deck 性能参数)
# =============================================
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000    # 吸收：增加到 50000 行
set -s escape-time 0

# 吸收：终端颜色与 True Color 支持 (非常重要)
set -g default-terminal "tmux-256color"
set -su terminal-overrides
set -su terminal-features
set -as terminal-features ",xterm-kitty:RGB:extkeys:clipboard,tmux-256color:RGB:extkeys:clipboard"

# Pi 需要的配置
set -s extended-keys on
set -s extended-keys-format csi-u


# =============================================
# 2. 快捷键设置 (保留你的习惯)
# =============================================
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 直觉分屏
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim 风格切换
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 快速重载
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# =============================================
# 3. 吸收 agent-deck 的核心功能
# =============================================

# 吸收：WSL/现代终端滚动优化 (自动进入复制模式)
# 当你在面板上向上滚动滚轮时，tmux 会自动进入 copy-mode
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# 吸收：复制模式下的滚轮支持
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

# 剪贴板集成（使用 OSC 52，支持 SSH 和嵌套 tmux）
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel



# window移动
# 按 Ctrl-Shift-Left 将窗口向左移
#bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
# 按 Ctrl-Shift-Right 将窗口向右移
#bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# 必须：开启允许程序（如 ssh 里的远程 tmux）穿透发送转义序列
set -g allow-passthrough on

# 必须：处理嵌套场景下的 Ms 序列（用于剪贴板透明传输）
set -s set-clipboard on

# =============================================
# 4. 插件管理 (TPM)
# =============================================
# TPM 和插件源码属于安装产物，放到 XDG data 目录，不放在 ~/.config/tmux 里。
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'sandudorogan/tmux-pane-tree'
set -g @plugin 'tmux-plugins/tpm'

# 插件配置
set -g @continuum-restore 'on'
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @tmux_pane_tree_install_agent_hooks 0
run '~/.local/share/tmux/plugins/tmux/catppuccin.tmux'

set-option -g allow-rename off
set-window-option -g automatic-rename off


# 状态栏样式 (保持你的配置)
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# 强制让窗口标签只显示你手动命名的内容 (#W)
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# 定义快捷键为 F12 (如果 F12 不行，请替换为 M-o)
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-bg "#11111b" \;\
    set status-left "#[bg=#f38ba8,fg=#11111b,bold] 󰒄 REMOTE #[bg=default,fg=#f38ba8]" \;\
    refresh-client -S \;\

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-bg \;\
    set -u status-left \;\
    refresh-client -S

bind i setw synchronize-panes \; display-message 'synchronize-panes: #{?pane_synchronized,on,off}'

# 初始化 TPM (确保路径正确)
run '~/.local/share/tmux/plugins/tpm/tpm'
