#!/usr/bin/python3
import re
import sys

key = "org.freedesktop.impl.portal.FileChooser"
section = None
inserted = False
output = []
for line in sys.stdin:
    header = re.match(r"^\s*\[([^]]+)\]\s*$", line)
    if header:
        section = header[1]
        if section == "preferred" and not inserted:
            output.extend([line.rstrip("\n") + "\n", f"{key}=gnome;gtk;\n"])
            inserted = True
            continue
    if section == "preferred" and re.match(rf"^\s*{re.escape(key)}\s*=", line):
        continue
    output.append(line)

if not inserted:
    if output and not output[-1].endswith("\n"):
        output.append("\n")
    output.extend(["[preferred]\n", f"{key}=gnome;gtk;\n"])
sys.stdout.write("".join(output))
