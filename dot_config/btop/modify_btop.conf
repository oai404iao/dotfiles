#!/bin/sh
set -eu

awk '
    /^[[:space:]]*color_theme[[:space:]]*=/ {
        if (!theme_written) {
            print "color_theme = \"matugen\""
            theme_written = 1
        }
        next
    }
    { print }
    END {
        if (!theme_written) {
            print "color_theme = \"matugen\""
        }
    }
'
